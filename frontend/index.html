<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Compiler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="shell-header">
    <div class="shell-brand">
      <span class="shell-prompt">~</span><span class="shell-slash">/</span>
      <h1 data-i18n="title">Simple Compiler</h1>
    </div>
    <div class="shell-controls">
      <button id="theme-toggle" aria-label="Toggle dark/light mode" class="shell-btn shell-btn-icon">☀️</button>
      <button id="lang-toggle" aria-label="Toggle language" class="shell-btn shell-btn-icon">EN</button>
    </div>
  </header>

  <main class="shell-main">
    <section class="editor-card card">
      <div class="card-header">
        <label for="language" data-i18n="languageLabel" class="card-label">Language</label>
        <select id="language" class="shell-select">
          <option value="python" title="Python">🐍 Python</option>
          <option value="c" title="C">🔧 C</option>
          <option value="cpp" title="C++">⚡ C++</option>
          <option value="csharp" title="C#">🔷 C#</option>
          <option value="java" title="Java">☕ Java</option>
          <option value="js" title="JavaScript">📜 JavaScript</option>
          <option value="ts" title="TypeScript">📘 TypeScript</option>
          <option value="sql" title="SQL">🗄️ SQL</option>
          <option value="lua" title="Lua">🌙 Lua</option>
          <option value="go" title="Go">🐹 Go</option>
          <option value="lean" title="Lean">🧮 Lean</option>
          <option value="r" title="R">📊 R</option>
          <option value="latex" title="LaTeX">📄 LaTeX</option>
          <option value="htmlcss" title="HTML/CSS">🌐 HTML/CSS</option>
        </select>
      </div>
      <textarea id="code" rows="12" class="shell-code" data-i18n-placeholder="placeholder"></textarea>
      <button id="run" data-i18n="runButton" class="shell-btn shell-btn-primary">Run</button>
    </section>

    <section class="output-card card" aria-live="polite">
      <div class="card-header">
        <h2 data-i18n="outputTitle" class="card-title">Output</h2>
      </div>
      <pre id="result" class="shell-output"></pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
