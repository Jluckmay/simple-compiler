<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Compiler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="shell-header">
    <div class="shell-brand">
      <span class="shell-prompt">~</span><span class="shell-slash">/</span>
      <h1 data-i18n="title">Simple Compiler</h1>
    </div>
    <div class="shell-controls">
      <button id="theme-toggle" aria-label="Toggle dark/light mode" class="shell-btn shell-btn-icon">☀️</button>
      <button id="lang-toggle" aria-label="Toggle language" class="shell-btn shell-btn-icon">EN</button>
    </div>
  </header>

  <main class="shell-main">
    <section class="editor-card card">
      <div class="card-header">
        <label for="language" data-i18n="languageLabel" class="card-label">Language</label>
        <div class="lang-grid" id="language-grid">
          <button type="button" class="lang-btn active" data-lang="python" title="Python">🐍</button>
          <button type="button" class="lang-btn" data-lang="c" title="C">🔧</button>
          <button type="button" class="lang-btn" data-lang="cpp" title="C++">⚡</button>
          <button type="button" class="lang-btn" data-lang="csharp" title="C#">🔷</button>
          <button type="button" class="lang-btn" data-lang="java" title="Java">☕</button>
          <button type="button" class="lang-btn" data-lang="js" title="JavaScript">📜</button>
          <button type="button" class="lang-btn" data-lang="ts" title="TypeScript">📘</button>
          <button type="button" class="lang-btn" data-lang="sql" title="SQL">🗄️</button>
          <button type="button" class="lang-btn" data-lang="lua" title="Lua">🌙</button>
          <button type="button" class="lang-btn" data-lang="go" title="Go">🐹</button>
          <button type="button" class="lang-btn" data-lang="lean" title="Lean">🧮</button>
          <button type="button" class="lang-btn" data-lang="r" title="R">📊</button>
          <button type="button" class="lang-btn" data-lang="latex" title="LaTeX">📄</button>
          <button type="button" class="lang-btn" data-lang="htmlcss" title="HTML/CSS">🌐</button>
        </div>
        <input type="hidden" id="language" value="python" />
      </div>
      <textarea id="code" rows="12" class="shell-code" placeholder="Write your code here..."></textarea>
      <button id="run" data-i18n="runButton" class="shell-btn shell-btn-primary">Run</button>
    </section>

    <section class="output-card card" aria-live="polite">
      <div class="card-header">
        <h2 data-i18n="outputTitle" class="card-title">Output</h2>
      </div>
      <pre id="result" class="shell-output"></pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
